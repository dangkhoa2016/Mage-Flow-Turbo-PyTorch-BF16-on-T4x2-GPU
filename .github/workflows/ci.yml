name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: CPU/static Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU/static test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Python sources
        run: python -m compileall -q mage_t4x2 public_demo scripts

      - name: Verify canonical public contract
        run: |
          python - <<'PY'
          from public_demo.contract import CANONICAL, canonical_model_path
          CANONICAL.validate()
          print("CANONICAL_PUBLIC_CONTRACT=PASS")
          print("MODEL_PATH=", canonical_model_path())
          PY

      - name: Run focused public/static tests
        run: |
          python -m pytest -q \
            tests/test_public_bootstrap.py \
            tests/test_public_contract.py \
            tests/test_public_demo_gates.py \
            tests/test_public_runner_static.py \
            tests/test_public_docs_contract.py \
            tests/test_public_showcase.py

      - name: Verify frozen qualified runtime baseline
        run: |
          python - <<'PY'
          from mage_t4x2.runtime_baseline import verify_runtime_baseline
          report = verify_runtime_baseline()
          print(report["status"])
          print("rows=", len(report.get("entries", [])))
          print("errors=", report.get("errors"))
          if report["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Check whitespace
        run: git diff --check

  history:
    name: Git history integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate HEAD whitespace
        run: git show --check --format=oneline --no-ext-diff HEAD >/dev/null

      - name: Git object integrity
        run: git fsck --full --no-reflogs